name: Database Backup
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lab-database-operations
  cancel-in-progress: false
jobs:
  database:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, cmc-lab]
    environment: lab-backup
    timeout-minutes: 60
    env:
      PGHOST: ${{ vars.PGHOST }}
      PGPORT: ${{ vars.PGPORT || '5432' }}
      PGUSER: ${{ secrets.PGUSER }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      PGSSLMODE: ${{ vars.PGSSLMODE || 'verify-full' }}
      PGSSLROOTCERT: ${{ vars.PGSSLROOTCERT }}
      PGDATABASE: ${{ vars.PGDATABASE }}
      PRODUCTION_DATABASE: ${{ vars.PGDATABASE }}
      S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
      BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.S3_REGION }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Database operation
        run: bash ci/database.sh backup
