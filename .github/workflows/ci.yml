name: Build and Push Docker Images
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths: ['backend/**', 'frontend/**', 'misc/parent-pom/**', 'misc/de-metas-common/**', 'docker-builds/**', 'ci/**', 'metasfresh-gitops/**', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lab-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyYAML==6.0.2
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.16.4
      - name: Check scripts and promotion guards
        run: |
          bash -n ci/build-lab.sh
          bash -n ci/database.sh
          python -m unittest discover -s ci -p 'test_*.py'
      - name: Validate chart
        run: |
          helm lint metasfresh-gitops/charts/erp-adapter --strict
          helm template erp metasfresh-gitops/charts/erp-adapter --namespace erp > rendered.yaml
      - name: Scan repository secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: secret
          exit-code: '1'
          trivyignores: '.trivyignore'
  build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: [self-hosted, linux, cmc-lab]
    timeout-minutes: 180
    env:
      HARBOR_REGISTRY: ${{ vars.HARBOR_REGISTRY }}
      HARBOR_PROJECT: ${{ vars.HARBOR_PROJECT }}
      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      METASFRESH_PACKAGES_READ_TOKEN: ${{ secrets.METASFRESH_PACKAGES_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check runner and configuration
        env:
          HARBOR_USER: ${{ secrets.CI_HARBOR_USERNAME }}
          HARBOR_TOKEN: ${{ secrets.CI_HARBOR_TOKEN }}
        run: |
          set -euo pipefail
          for key in HARBOR_REGISTRY HARBOR_PROJECT METASFRESH_PACKAGES_READ_TOKEN HARBOR_USER HARBOR_TOKEN; do
            test -n "${!key}" || { echo "::error::Missing $key"; exit 1; }
          done
          for tool in docker python3 trivy; do command -v "$tool"; done
          docker info >/dev/null
          docker buildx version
      - name: Build source and test
        run: bash ci/build-lab.sh
      - name: Scan all images before publishing
        run: |
          set -euo pipefail
          for image in metas-app metas-api metas-frontend; do
            trivy image --severity HIGH,CRITICAL --exit-code 1 "lab/$image:$RELEASE_ID"
          done
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.CI_HARBOR_USERNAME }}
          password: ${{ secrets.CI_HARBOR_TOKEN }}
      - name: Push and record release evidence
        run: |
          set -euo pipefail
          for image in metas-app metas-api metas-frontend; do
            target="$HARBOR_REGISTRY/$HARBOR_PROJECT/$image:$RELEASE_ID"
            docker tag "lab/$image:$RELEASE_ID" "$target"
            docker push "$target"
            docker buildx imagetools inspect "$target" --format '{{json .Manifest}}' > "ci-output/$image.json"
          done
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          evidence = {name: os.environ[name] for name in ('GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT', 'HARBOR_REGISTRY', 'HARBOR_PROJECT', 'RELEASE_ID')}
          Path('ci-output/release.json').write_text(json.dumps(evidence))
          PY
      - name: Remove temporary credentials
        if: always()
        run: rm -f ci-output/settings.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-evidence
          path: |
            ci-output/*.json
            ci-output/reports/**/*.xml
          retention-days: 14
