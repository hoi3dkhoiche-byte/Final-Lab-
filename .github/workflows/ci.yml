name: LAB Build and GitOps PR
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lab-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n ci/build-lab.sh
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.16.4
      - run: helm lint metasfresh-gitops/charts/erp-adapter
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: secret
          exit-code: '1'
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: [self-hosted, linux, cmc-lab]
    timeout-minutes: 180
    env:
      HARBOR_REGISTRY: ${{ vars.HARBOR_REGISTRY }}
      HARBOR_PROJECT: ${{ vars.HARBOR_PROJECT }}
      GITOPS_REPOSITORY: ${{ vars.GITOPS_REPOSITORY }}
      GITOPS_BASE_BRANCH: ${{ vars.GITOPS_BASE_BRANCH || 'main' }}
      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      METASFRESH_PACKAGES_READ_TOKEN: ${{ secrets.METASFRESH_PACKAGES_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check configuration
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          HARBOR_USER: ${{ secrets.CI_HARBOR_USERNAME }}
          HARBOR_TOKEN: ${{ secrets.CI_HARBOR_TOKEN }}
        run: |
          set -euo pipefail
          for key in HARBOR_REGISTRY HARBOR_PROJECT GITOPS_REPOSITORY METASFRESH_PACKAGES_READ_TOKEN GH_TOKEN HARBOR_USER HARBOR_TOKEN; do
            test -n "${!key}" || { echo "::error::Missing $key"; exit 1; }
          done
          for tool in docker python3 helm gh trivy; do command -v "$tool"; done
          docker info >/dev/null
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install PyYAML==6.0.2
      - name: Build and test source
        run: bash ci/build-lab.sh
      - name: Scan every image before push
        run: |
          set -euo pipefail
          for image in metas-app metas-api metas-frontend; do
            trivy image --severity HIGH,CRITICAL --exit-code 1 "lab/$image:$RELEASE_ID"
          done
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ secrets.CI_HARBOR_USERNAME }}
          password: ${{ secrets.CI_HARBOR_TOKEN }}
      - name: Push and capture digests
        run: |
          set -euo pipefail
          for image in metas-app metas-api metas-frontend; do
            target="$HARBOR_REGISTRY/$HARBOR_PROJECT/$image:$RELEASE_ID"
            docker tag "lab/$image:$RELEASE_ID" "$target"
            docker push "$target"
            docker buildx imagetools inspect "$target" --format '{{json .Manifest}}' > "ci-output/$image.json"
          done
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPOSITORY }}
          ref: ${{ env.GITOPS_BASE_BRANCH }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops-release
      - name: Update GitOps and create PR
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
        run: |
          set -euo pipefail
          python ci/update_gitops.py
          helm lint gitops-release/charts/erp-adapter
          helm template erp gitops-release/charts/erp-adapter > ci-output/rendered.yaml
          cd gitops-release
          branch="release/$RELEASE_ID"
          git checkout -b "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add versions.yaml charts/erp-adapter/values.yaml
          git commit -m "chore: release ERP $RELEASE_ID"
          git push origin "$branch"
          printf 'Source: %s\nPipeline: %s\nReview all three image digests before merging. Argo CD owns deployment. Migration requires a separate backup and release runbook.\n' "$GITHUB_SHA" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/release-pr.md"
          gh pr create --repo "$GITOPS_REPOSITORY" --base "$GITOPS_BASE_BRANCH" --head "$branch" --title "Release ERP $RELEASE_ID" --body-file "$RUNNER_TEMP/release-pr.md"
      - if: always()
        run: rm -f ci-output/settings.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-evidence
          path: |
            ci-output/*.json
            ci-output/*.yaml
            ci-output/reports/**/*.xml
