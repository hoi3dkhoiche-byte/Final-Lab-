apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: erp-readonly
  namespace: erp
rules:
  - apiGroups: ["", "apps", "batch", "extensions", "networking.k8s.io", "autoscaling"]
    resources: ["pods", "pods/log", "deployments", "replicasets", "statefulsets", "daemonsets", "jobs", "cronjobs", "services", "endpoints", "ingresses", "horizontalpodautoscalers", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: erp-operator
  namespace: erp
rules:
  - apiGroups: ["", "apps", "batch", "extensions", "networking.k8s.io", "autoscaling"]
    resources: ["*"]
    verbs: ["*"]
  # Explicitly deny secrets access for standard operator, they should use SealedSecrets
  # We don't include 'secrets' resource here.
