apiVersion: v1
kind: Service
metadata:
  name: metasfresh-ui
  namespace: {{ include "erp.namespace" . }}
  labels:
    app: metasfresh-ui
    {{- include "erp.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  type: ClusterIP
  selector: {app: metasfresh-ui}
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
