apiVersion: v1
kind: Service
metadata:
  name: metasfresh-api
  namespace: {{ include "erp.namespace" . }}
  labels:
    app: metasfresh-api
    {{- include "erp.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  type: ClusterIP
  selector: {app: metasfresh-api}
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: http
