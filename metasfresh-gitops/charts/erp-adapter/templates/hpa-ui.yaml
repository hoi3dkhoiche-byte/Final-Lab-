{{- if .Values.ui.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: metasfresh-ui
  namespace: {{ include "erp.namespace" . }}
  labels:
    {{- include "erp.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "40"
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: metasfresh-ui}
  minReplicas: {{ .Values.ui.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.ui.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.ui.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
