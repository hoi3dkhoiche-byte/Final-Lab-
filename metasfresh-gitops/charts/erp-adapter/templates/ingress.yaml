{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: metasfresh-ingress
  namespace: {{ include "erp.namespace" . }}
  labels:
    {{- include "erp.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "40"
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /rest/api
            pathType: Prefix
            backend:
              service:
                name: metasfresh-api
                port: {number: 8080}
          - path: /stomp
            pathType: Prefix
            backend:
              service:
                name: metasfresh-api
                port: {number: 8080}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: metasfresh-ui
                port: {number: 80}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tlsSecretName }}
{{- end }}
