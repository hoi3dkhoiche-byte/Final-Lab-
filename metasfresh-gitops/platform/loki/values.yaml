deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: {prefix: index_, period: 24h}
  limits_config:
    retention_period: 48h
    ingestion_rate_mb: 2
    ingestion_burst_size_mb: 4
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: filesystem
  querier:
    max_concurrent: 1
singleBinary:
  replicas: 1
  nodeSelector:
    cmc-cloud-k8s-nodegroups: nodegroup-monitoring
  tolerations:
    - {key: dedicated, operator: Equal, value: monitoring, effect: NoSchedule}
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 1000m, memory: 768Mi}
  persistence:
    enabled: true
    enableStatefulSetAutoDeletePVC: false
    whenDeleted: Retain
    whenScaled: Retain
    storageClass: null
    size: 10Gi
    annotations:
      argocd.argoproj.io/sync-options: Prune=false,Delete=false
gateway:
  enabled: true
  replicas: 1
  nodeSelector:
    cmc-cloud-k8s-nodegroups: nodegroup-monitoring
  tolerations:
    - {key: dedicated, operator: Equal, value: monitoring, effect: NoSchedule}
  resources:
    requests: {cpu: 25m, memory: 32Mi}
    limits: {cpu: 100m, memory: 64Mi}
  service: {type: ClusterIP}
  ingress: {enabled: false}
read: {replicas: 0}
write: {replicas: 0}
backend: {replicas: 0}
minio: {enabled: false}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
lokiCanary: {enabled: false}
test: {enabled: false}
sidecar:
  rules: {enabled: false}
monitoring:
  selfMonitoring: {enabled: false}
