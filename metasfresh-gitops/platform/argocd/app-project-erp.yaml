apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: erp
  namespace: argocd
spec:
  description: Project for ERP application workloads
  sourceRepos:
    - '*' # Thay bằng URL repo gitops thực tế khi có
  destinations:
    - namespace: erp
      server: https://kubernetes.default.svc
    - namespace: ingress-system
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: PersistentVolumeClaim
    - group: networking.k8s.io
      kind: Ingress
  namespaceResourceBlacklist:
    - group: ''
      kind: ResourceQuota
    - group: ''
      kind: LimitRange
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: rbac.authorization.k8s.io
      kind: Role
