apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metasfresh-erp
  namespace: argocd
spec:
  project: erp
  source:
    # Required configured URL; bootstrap fills this before applying.
    repoURL: https://github.com/hoi3dkhoiche-byte/GitOps-final-lab.git
    targetRevision: main
    path: charts/erp-adapter
    helm:
      releaseName: erp
      valueFiles:
        - ../../environments/lab/values-lab.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: erp
  # Initial sync is manual. Enable automation only after business smoke tests.
  syncPolicy:
    syncOptions:
      - RespectIgnoreDifferences=true
  # No finalizer and no CreateNamespace: the bootstrap owns namespace lifecycle.
